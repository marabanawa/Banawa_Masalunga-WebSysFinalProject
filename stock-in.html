<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stock-In | MunchTrack</title>
    <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="page-content">
                <h2 style="margin-bottom: 20px;">Record Stock-In</h2>
                <div class="card" style="max-width: 600px;">
                    <form onsubmit="event.preventDefault(); alert('Stock-In Recorded'); window.location.href='inventory.html';">
                        <div class="input-group"><label style="width: 120px; font-weight: 600;">Product</label><select style="width: 100%; padding: 10px;"><option>Iced Coffee</option><option>Milk Tea</option></select></div>
                        <div class="input-group"><label style="width: 120px; font-weight: 600;">Quantity</label><input type="number" required style="width: 100%; padding: 10px;"></div>
                        <button type="submit" class="btn btn-primary-sm" style="width: 100%;">Record</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/data.js"></script><script src="/js/layout.js"></script><script>loadLayout('stock-in');</script>
</body>
</html>
