<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | MunchTrack</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="page-content">
                <h2 style="margin-bottom: 20px;">Add New Product</h2>
                <div class="card" style="max-width: 600px;">
                    <form id="add-product-form">
                        <div class="input-group"><label style="width: 120px; font-weight: 600;">Name</label><input type="text" id="p-name" required style="border: 1px solid var(--border); padding: 10px; border-radius: 5px; width: 100%;"></div>
                        <div class="input-group">
                            <label style="width: 120px; font-weight: 600;">Category</label>
                            <select id="p-category" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px;">
                                <option value="Beverages">Beverages</option><option value="Desserts">Desserts</option><option value="Snacks">Snacks</option>
                            </select>
                        </div>
                        <div class="input-group"><label style="width: 120px; font-weight: 600;">Price (₱)</label><input type="number" id="p-price" required style="border: 1px solid var(--border); padding: 10px; border-radius: 5px; width: 100%;"></div>
                        <div class="input-group"><label style="width: 120px; font-weight: 600;">Stock</label><input type="number" id="p-stock" required style="border: 1px solid var(--border); padding: 10px; border-radius: 5px; width: 100%;"></div>
                        <div class="input-group"><label style="width: 120px; font-weight: 600;">Min Alert</label><input type="number" id="p-minStock" required style="border: 1px solid var(--border); padding: 10px; border-radius: 5px; width: 100%;"></div>
                        <div style="display: flex; gap: 10px; margin-top: 20px;">
                            <a href="products.html" class="btn btn-outline" style="text-align: center; flex: 1;">Cancel</a>
                            <button type="submit" class="btn btn-primary-sm" style="flex: 2;">Save Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/data.js"></script>
    <script src="/js/layout.js"></script>

    <script>
        loadLayout('products');
        document.getElementById('add-product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            DB.addProduct({
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                price: parseFloat(document.getElementById('p-price').value),
                stock: parseInt(document.getElementById('p-stock').value),
                minStock: parseInt(document.getElementById('p-minStock').value)
            });
            window.location.href = 'products.html';
        });
    </script>
</body>
</html>
