<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Categories | MunchTrack</title>
    <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="page-content">
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">

                    <div class="card">
                        <div class="card-header"><h3>Categories</h3></div>
                        <table class="data-table">
                            <thead><tr><th>Name</th><th>Description</th><th>Actions</th></tr></thead>
                            <tbody>
                                <tr><td>Beverages</td><td>Drinks</td><td><i class="fa-solid fa-edit"></i> <i class="fa-solid fa-trash"></i></td></tr>
                                <tr><td>Desserts</td><td>Pastries</td><td><i class="fa-solid fa-edit"></i> <i class="fa-solid fa-trash"></i></td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="card">
                        <div class="card-header"><h3>Add Category</h3></div>
                        <form onsubmit="event.preventDefault(); alert('Category Added');">
                            <div class="input-group"><input type="text" placeholder="Name" required style="border: 1px solid var(--border); padding: 10px; border-radius: 5px; width: 100%;"></div>
                            <button type="submit" class="btn btn-primary-sm" style="width: 100%;">Add</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/data.js"></script><script src="/js/layout.js"></script><script>loadLayout('categories');</script>
</body>
</html>
