<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | MunchTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .settings-layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 30px;
            max-width: 900px;
        }
        
        .settings-sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .settings-tab {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            font-family: inherit;
        }

        .settings-tab:hover {
            background: var(--border);
        }

        .settings-tab.active {
            background: var(--primary);
            color: var(--white);
        }

        .settings-content {
            display: none;
        }

        .settings-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #e0e7ff;
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="page-content">
                <h2 style="margin-bottom: 25px; font-size: 1.25rem;">System Settings</h2>
                
                <div class="settings-layout">
                    <div class="card settings-sidebar" style="height: fit-content; padding: 10px;">
                        <button class="settings-tab active" onclick="switchTab('profile', this)">
                            <i class="fa-solid fa-user"></i> Profile Settings
                        </button>

                        <button class="settings-tab" onclick="switchTab('security', this)">
                            <i class="fa-solid fa-shield-halved"></i> Security
                        </button>

                        <button class="settings-tab" onclick="switchTab('business', this)">
                            <i class="fa-solid fa-store"></i> Business Preferences
                        </button>

                        <hr style="border: none; border-top: 1px solid var(--border); margin: 10px 0;">
                        <a href="index.html" class="settings-tab" style="color: var(--danger); text-decoration: none;">
                            <i class="fa-solid fa-right-from-bracket"></i> Logout
                        </a>
                    </div>

                    <div class="card">
                        
                        <div id="tab-profile" class="settings-content active">
                            <h3 style="margin-bottom: 20px; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Profile Information</h3>
                            <div style="display: flex; gap: 30px; align-items: flex-start;">
                                <div class="avatar-preview">
                                    <i class="fa-solid fa-user-circle"></i>
                                </div>
                                <form id="profile-form" style="flex: 1;">
                                    <div class="form-row">
                                        <div class="form-col">
                                            <label>Full Name</label>
                                            <input type="text" id="set-name" required>
                                        </div>

                                        <div class="form-col">
                                            <label>Email Address</label>
                                            <input type="email" id="set-email" required>
                                        </div>
                                    </div>

                                    <div class="form-row">
                                        <div class="form-col">
                                            <label>Business Name</label>
                                            <input type="text" id="set-business" required>
                                        </div>

                                        <div class="form-col">
                                            <label>Role</label>
                                            <input type="text" value="Administrator" disabled style="background: var(--bg-main); cursor: not-allowed;">
                                        </div>
                                    </div>

                                    <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                                        <button type="submit" class="btn btn-primary">Save Changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div id="tab-security" class="settings-content">
                            <h3 style="margin-bottom: 20px; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Change Password</h3>
                            <form id="security-form" style="max-width: 500px;">
                                <div class="form-col" style="margin-bottom: 15px;">
                                    <label>Current Password</label>
                                    <input type="password" id="current-pass" required>
                                </div>

                                <div class="form-col" style="margin-bottom: 15px;">
                                    <label>New Password</label>
                                    <input type="password" id="new-pass" required minlength="6">
                                    <small style="color: var(--text-muted); font-size: 0.75rem; margin-top: 5px;">Must be at least 6 characters long.</small>
                                </div>

                                <div class="form-col" style="margin-bottom: 20px;">
                                    <label>Confirm New Password</label>
                                    <input type="password" id="confirm-pass" required minlength="6">
                                </div>

                                <div style="display: flex; justify-content: flex-end;">
                                    <button type="submit" class="btn btn-primary">Update Password</button>
                                </div>
                            </form>
                        </div>

                        <div id="tab-business" class="settings-content">
                            <h3 style="margin-bottom: 20px; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Business Preferences</h3>
                            <form id="business-form">
                                <div class="form-row">
                                    <div class="form-col">
                                        <label>Currency Symbol</label>
                                        <select id="set-currency">
                                            <option value="₱">Philippine Peso (₱)</option>
                                            <option value="$">US Dollar ($)</option>
                                            <option value="€">Euro (€)</option>
                                        </select>
                                    </div>

                                    <div class="form-col">
                                        <label>Default Tax Rate (%)</label>
                                        <input type="number" id="set-tax" placeholder="e.g. 12" min="0" max="100">
                                    </div>
                                </div>

                                <div class="form-row" style="margin-top: 20px;">
                                    <div class="form-col">
                                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                                            <input type="checkbox" id="set-notifications" style="width: auto;">
                                            Enable Low-Stock Email Notifications
                                        </label>
                                        <small style="color: var(--text-muted); font-size: 0.75rem; margin-top: 5px; margin-left: 25px;">Send an alert when a product hits its minimum stock level.</small>
                                    </div>
                                </div>

                                <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                                    <button type="submit" class="btn btn-primary">Save Preferences</button>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script>
        loadLayout('settings');

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.settings-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.settings-tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const data = DB.getData();
            if(data.business) {
                document.getElementById('set-name').value = data.business.owner || 'Admin';
                document.getElementById('set-email').value = data.business.email || 'admin@munchtrack.com';
                document.getElementById('set-business').value = data.business.name || 'My Cafe';
                
                if(data.business.currency) document.getElementById('set-currency').value = data.business.currency;
                if(data.business.taxRate) document.getElementById('set-tax').value = data.business.taxRate;
                if(data.business.lowStockAlerts !== undefined) document.getElementById('set-notifications').checked = data.business.lowStockAlerts;
            }
        });

        document.getElementById('profile-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const data = DB.getData();
            
            data.business.owner = document.getElementById('set-name').value;
            data.business.email = document.getElementById('set-email').value;
            data.business.name = document.getElementById('set-business').value;
            
            DB.saveData(data);
            alert('Profile updated successfully!');
            
            loadLayout('settings');
        });

        document.getElementById('security-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const newPass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;

            if (newPass !== confirmPass) {
                alert("Error: New passwords do not match!");
                return;
            }

            alert('Password updated successfully! (Simulated)');
            document.getElementById('security-form').reset();
        });

        document.getElementById('business-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const data = DB.getData();
            
            data.business.currency = document.getElementById('set-currency').value;
            data.business.taxRate = parseFloat(document.getElementById('set-tax').value) || 0;
            data.business.lowStockAlerts = document.getElementById('set-notifications').checked;
            
            DB.saveData(data);
            alert('Business preferences saved!');
        });
    </script>
</body>
</html>
