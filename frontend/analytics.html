<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | MunchTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="page-content">
                <h2 style="margin-bottom: 20px;">Sales Analytics</h2>
                <div class="dashboard-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue"><i class="fa-solid fa-chart-bar"></i></div>
                        <div class="stat-info"><h4>Sales</h4><h2>₱128,500</h2></div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon orange"><i class="fa-solid fa-pie-chart"></i></div>
                        <div class="stat-info"><h4>Beverages</h4><h2>45%</h2></div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon green"><i class="fa-solid fa-arrow-trend-up"></i></div>
                        <div class="stat-info"><h4>Growth</h4><h2>+12%</h2></div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon red"><i class="fa-solid fa-bag-shopping"></i></div>
                        <div class="stat-info"><h4>Orders</h4><h2>1,240</h2></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Monthly Sales Trend</h3></div>
                    <div class="chart-placeholder" style="height: 260px;">
                        <div class="chart-bar" style="height: 45%;"></div>
                        <div class="chart-bar" style="height: 65%;"></div>
                        <div class="chart-bar" style="height: 35%;"></div>
                        <div class="chart-bar" style="height: 80%;"></div>
                        <div class="chart-bar" style="height: 55%;"></div>
                        <div class="chart-bar" style="height: 92%;"></div>
                        <div class="chart-bar" style="height: 70%;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script>loadLayout('analytics');</script>
</body>
</html>
