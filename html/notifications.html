<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notifications | MunchTrack</title>
    <link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="page-content">
                <h2 style="margin-bottom: 20px;">Notifications</h2>
                <div class="card">
                    <ul style="list-style: none;">
                        <li style="padding: 15px; border-bottom: 1px solid var(--border); display: flex; gap: 15px; align-items: center;">
                            <i class="fa-solid fa-triangle-exclamation" style="color: var(--danger); font-size: 1.5rem;"></i>
                            <div><p style="font-weight: 600;">Brownie is running low (5 pcs left)</p><small style="color: var(--text-muted);">Today, 9:15 AM</small></div>
                        </li>

                        <li style="padding: 15px; display: flex; gap: 15px; align-items: center;">
                            <i class="fa-solid fa-circle-info" style="color: var(--primary); font-size: 1.5rem;"></i>
                            <div><p style="font-weight: 600;">New sale recorded: ₱450.00</p><small style="color: var(--text-muted);">Yesterday, 6:20 PM</small></div>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/data.js"></script><script src="/js/layout.js"></script><script>loadLayout('notifications');</script>
</body>
</html>
