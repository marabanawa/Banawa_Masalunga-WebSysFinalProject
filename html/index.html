<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MunchTrack</title>
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-logo">
                <i class="fa-solid fa-utensils"></i>
                <h2>MunchTrack</h2>
                <p>Track. Manage. Grow.</p>
            </div>

            <div id="login-section">
                <h3>Welcome Back!</h3>
                <p class="subtitle">Login to your account</p>
                
                <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    
                    <div class="form-options">
                        <label><input type="checkbox"> Remember Me</label>
                        <a href="#">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn-primary-full">Login</button>
                </form>
                
                <p class="switch-auth">Don't have an account? <a href="#" onclick="toggleAuth('register')">Register</a></p>
            </div>

            <div id="register-section" class="hidden">
                <h3>Create Account</h3>
                <p class="subtitle">Start managing your business today!</p>
                
                <form onsubmit="event.preventDefault(); alert('Account Created! You can now login.'); toggleAuth('login');">
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" placeholder="Full Name" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fa-solid fa-store"></i>
                        <input type="text" placeholder="Business Name" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    
                    <button type="submit" class="btn-primary-full">Create Account</button>
                </form>
                
                <p class="switch-auth">Already have an account? <a href="#" onclick="toggleAuth('login')">Login</a></p>
            </div>

        </div>
    </div>

    <script>
        function toggleAuth(view) {
            const loginSection = document.getElementById('login-section');
            const registerSection = document.getElementById('register-section');

            if (view === 'register') {
                loginSection.classList.add('hidden');
                registerSection.classList.remove('hidden');
            } else {
                registerSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
