<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sales History | MunchTrack</title>
    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="page-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Sales Transaction History</h2>
                    <a href="new-sale.html" class="btn btn-primary-sm"><i class="fa-solid fa-cash-register"></i> New Sale</a>
                </div>

                <div class="card">
                    <table class="data-table">
                        <thead><tr><th>ID</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead>
                        <tbody id="sales-history-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="js/data.js"></script><script src="js/layout.js"></script><script src="/js/sales.js"></script><script>loadLayout('sales');</script>
</body>
</html>
