<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | MunchTrack</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="page-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Product List</h2>
                    <a href="add-product.html" class="btn btn-primary-sm"><i class="fa-solid fa-plus"></i> Add Product</a>
                </div>

                <div class="card">
                    <table class="data-table">
                        <thead><tr><th>Product Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="product-list-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/data.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/products.js"></script>
    <script>loadLayout('products');</script>
</body>
</html>
