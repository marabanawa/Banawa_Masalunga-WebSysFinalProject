<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inventory | MunchTrack</title>
    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="header-container"></div>
            <div class="page-content">
                <h2 style="margin-bottom: 20px;">Inventory Overview</h2>
                <div class="card">
                    <table class="data-table">
                        <thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Min Stock</th><th>Status</th></tr></thead>
                        <tbody id="inventory-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="js/data.js"></script><script src="js/layout.js"></script><script src="/js/inventory.js"></script><script>loadLayout('inventory');</script>
</body>
</html>
